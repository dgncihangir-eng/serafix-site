<section style="max-width: 1280px; margin: 0 auto; padding: 56px 24px 0">
<span class="up" style="display: inline-block; font-size: 13px; font-weight: 700; color: #1F7A47; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 12px">{{ t.guideText }}</span>
<h1 class="fh" style="margin: 0 0 12px; font-size: 44px; line-height: 1.12; letter-spacing: -0.02em">{{ t.nav.guide }}</h1>
<p style="margin: 0; font-size: 18px; line-height: 1.7; color: #3F4D42; max-width: 760px">{{ meta.desc }}</p>
</section>
<section style="max-width: 1280px; margin: 0 auto; padding: 40px 24px 0">
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px">
{% for a in guides %}
<a href="{{ a.url }}" class="bl gcard" style="display: flex; flex-direction: column; gap: 12px; background: #FFFFFF; border: 1px solid #E3E8E4; padding: 28px; color: #11261C">
<span class="up" style="font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #1F7A47">{{ a.tag }}</span>
<strong class="fh" style="font-size: 22px; line-height: 1.3; font-weight: 600">{{ a.title }}</strong>
<span style="font-size: 15px; line-height: 1.6; color: #5B6660">{{ a.summary }}</span>
<span style="margin-top: auto; padding-top: 8px; font-weight: 700; color: #1F7A47">{{ t.readMore }}</span>
</a>
{% endfor %}
</div>
</section>
